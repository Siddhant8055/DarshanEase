<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pandharpurSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="45%" stop-color="#FB8C00" />
      <stop offset="80%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#80DEEA" />
    </linearGradient>
    <linearGradient id="riverChandrabhaga" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ACC1" />
      <stop offset="60%" stop-color="#00838F" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
    <linearGradient id="vitthalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#pandharpurSky)" />

  <!-- Sacred Chandrabhaga Crescent River Bed -->
  <rect y="390" width="800" height="110" fill="url(#riverChandrabhaga)" />
  <path d="M0 390 Q 200 375, 400 390 T 800 380 L 800 500 L 0 500 Z" fill="#00ACC1" opacity="0.6" />

  <!-- Mahadwar Ghat Steps -->
  <rect x="150" y="370" width="500" height="8" fill="#D7CCC8" />
  <rect x="180" y="378" width="440" height="8" fill="#BCAAA4" />
  <rect x="210" y="386" width="380" height="8" fill="#A1887F" />

  <!-- Varkari Temple Spire Architecture -->
  <!-- Base Solkambi Mandap -->
  <rect x="240" y="270" width="320" height="100" fill="#4E342E" rx="3" />

  <!-- Central Vitthal Shikhara Tower -->
  <path d="M 400 80 Q 425 170, 445 270 L 355 270 Q 375 170, 400 80 Z" fill="url(#vitthalGold)" />
  
  <!-- Shikhara Carved Tiers -->
  <rect x="365" y="210" width="70" height="12" fill="#E65100" />
  <rect x="375" y="160" width="50" height="10" fill="#E65100" />
  <rect x="385" y="115" width="30" height="8" fill="#E65100" />

  <!-- Kalash & Garuda Dhwaja (Flag) -->
  <circle cx="400" cy="72" r="8" fill="#FFF8E7" />
  <rect x="398" y="42" width="4" height="30" fill="#FFF8E7" />
  <path d="M 402 42 L 440 54 L 402 66 Z" fill="#FF9933" />

  <!-- Namdev Payari (Historic Gateway Step Portal) -->
  <path d="M 370 370 L 370 310 Q 400 290, 430 310 L 430 370 Z" fill="#211510" />

  <!-- Flanking Tulsi Vrindavan and Towers -->
  <rect x="200" y="325" width="25" height="45" fill="#3E2723" />
  <circle cx="212" cy="318" r="10" fill="#388E3C" />
  <rect x="575" y="325" width="25" height="45" fill="#3E2723" />
  <circle cx="587" cy="318" r="10" fill="#388E3C" />

  <!-- Title Badge -->
  <rect x="220" y="440" width="360" height="36" rx="18" fill="rgba(0,0,0,0.6)" />
  <text x="400" y="464" font-family="'Segoe UI', Poppins, sans-serif" font-size="16" font-weight="bold" fill="#FFE082" text-anchor="middle">
    SHREE VITTHAL-RUKMINI PANDHARPUR
  </text>
</svg>
