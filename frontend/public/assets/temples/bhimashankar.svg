<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sahyaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A237E" />
      <stop offset="40%" stop-color="#283593" />
      <stop offset="75%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <linearGradient id="forestGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="ancientNagara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#546E7A" />
      <stop offset="50%" stop-color="#37474F" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sahyaSky)" />

  <!-- Dense Sahyadri Forest Hills (Bhimashankar Wildlife Sanctuary) -->
  <polygon points="350,110 100,310 600,310" fill="url(#forestGreen)" opacity="0.9" />
  <polygon points="580,120 380,330 780,330" fill="url(#forestGreen)" opacity="0.85" />
  <rect y="310" width="800" height="190" fill="#1B5E20" />

  <!-- Bhima River Stream -->
  <path d="M 0 420 Q 250 390, 500 425 T 800 415 L 800 500 L 0 500 Z" fill="#0277BD" opacity="0.7" />

  <!-- Bhimashankar Nagara Style Temple Structure -->
  <!-- Base Foundation -->
  <rect x="260" y="260" width="280" height="110" fill="url(#ancientNagara)" rx="3" />

  <!-- High Nagara Shikhara -->
  <path d="M 400 80 Q 425 170, 445 260 L 355 260 Q 375 170, 400 80 Z" fill="url(#ancientNagara)" />
  <ellipse cx="400" cy="75" r="14" ry="5" fill="#78909C" />
  <circle cx="400" cy="65" r="6" fill="#FFD700" />
  <rect x="398" y="40" width="4" height="25" fill="#FFD700" />
  <path d="M 402 40 L 435 50 L 402 60 Z" fill="#FF9933" />

  <!-- Sabha Mandap & Side Shikhara -->
  <path d="M 310 170 Q 325 215, 340 260 L 280 260 Q 295 215, 310 170 Z" fill="url(#ancientNagara)" />
  <path d="M 490 170 Q 505 215, 520 260 L 460 260 Q 475 215, 490 170 Z" fill="url(#ancientNagara)" />

  <!-- Roman Style Bell (Chimaji Appa Memorial Bell) -->
  <rect x="235" y="275" width="6" height="40" fill="#B0BEC5" />
  <circle cx="238" cy="320" r="10" fill="#D4AF37" />

  <!-- Temple Entrance Stone Doorway -->
  <path d="M 375 370 L 375 315 Q 400 295, 425 315 L 425 370 Z" fill="#111111" />

  <!-- Title Badge -->
  <rect x="230" y="440" width="340" height="36" rx="18" fill="rgba(0,0,0,0.6)" />
  <text x="400" y="464" font-family="'Segoe UI', Poppins, sans-serif" font-size="16" font-weight="bold" fill="#FFE082" text-anchor="middle">
    BHIMASHANKAR JYOTIRLINGA
  </text>
</svg>
