<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shirdiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFF8E7" />
    </linearGradient>
    <radialGradient id="spiritualGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFE082" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="marbleWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5F5F5" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#shirdiSky)" />

  <!-- Divine Halo Glow -->
  <circle cx="400" cy="220" r="160" fill="url(#spiritualGlow)" />

  <!-- Marble Samadhi Mandir Complex -->
  <!-- Base Foundation -->
  <rect x="230" y="310" width="340" height="85" fill="url(#marbleWhite)" rx="4" />
  
  <!-- Central Golden Tower / Dome -->
  <path d="M 400 110 Q 420 190, 440 260 L 360 260 Q 380 190, 400 110 Z" fill="#D4AF37" />
  <circle cx="400" cy="100" r="10" fill="#FFD700" />
  <rect x="398" y="70" width="4" height="30" fill="#FFD700" />
  <!-- Saffron Flag -->
  <path d="M 402 70 L 435 80 L 402 90 Z" fill="#FF5722" />

  <!-- Two Side Decorative Domes -->
  <path d="M 320 230 Q 340 180, 360 230 Z" fill="#D4AF37" />
  <path d="M 440 230 Q 460 180, 480 230 Z" fill="#D4AF37" />

  <!-- Marble Terrace & Pillars -->
  <rect x="260" y="260" width="280" height="50" fill="url(#marbleWhite)" />
  <rect x="280" y="270" width="10" height="40" fill="#BDBDBD" />
  <rect x="330" y="270" width="10" height="40" fill="#BDBDBD" />
  <rect x="460" y="270" width="10" height="40" fill="#BDBDBD" />
  <rect x="510" y="270" width="10" height="40" fill="#BDBDBD" />

  <!-- Holy Golden Entrance Portal -->
  <path d="M 370 395 L 370 325 Q 400 305, 430 325 L 430 395 Z" fill="#D4AF37" />

  <!-- Sacred Neem Tree Foliage on side -->
  <circle cx="180" cy="300" r="45" fill="#2E7D32" opacity="0.9" />
  <circle cx="210" cy="270" r="35" fill="#388E3C" opacity="0.9" />
  <rect x="175" y="320" width="15" height="75" fill="#5D4037" />

  <!-- Title Badge -->
  <rect x="230" y="440" width="340" height="36" rx="18" fill="rgba(0,0,0,0.6)" />
  <text x="400" y="464" font-family="'Segoe UI', Poppins, sans-serif" font-size="16" font-weight="bold" fill="#FFE082" text-anchor="middle">
    SHRI SAIBABA SANSTHAN SHIRDI
  </text>
</svg>
