<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="somnathSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#80D8FF" />
      <stop offset="100%" stop-color="#0277BD" />
    </linearGradient>
    <linearGradient id="sandStone" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E5A65D" />
      <stop offset="50%" stop-color="#C68032" />
      <stop offset="100%" stop-color="#8D4C13" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0288D1" />
      <stop offset="50%" stop-color="#01579B" />
      <stop offset="100%" stop-color="#002F6C" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#somnathSky)" />

  <!-- Arabian Sea Shoreline -->
  <rect y="380" width="800" height="120" fill="url(#oceanGrad)" />
  <path d="M0 380 Q 200 370, 400 380 T 800 375 L 800 500 L 0 500 Z" fill="#0277BD" opacity="0.7" />

  <!-- Beach Sand Bed -->
  <rect y="360" width="800" height="30" fill="#D7CCC8" opacity="0.8" />

  <!-- Grand Somnath Shikhara Tower (Chalukya Architecture) -->
  <path d="M 400 80 Q 425 200, 460 330 L 340 330 Q 375 200, 400 80 Z" fill="url(#sandStone)" />
  
  <!-- Shikhara Layer Details -->
  <rect x="350" y="270" width="100" height="15" fill="#A05A1C" />
  <rect x="360" y="220" width="80" height="12" fill="#A05A1C" />
  <rect x="370" y="170" width="60" height="10" fill="#A05A1C" />
  <rect x="380" y="120" width="40" height="8" fill="#A05A1C" />

  <!-- Sabha Mandap Dome Structure -->
  <path d="M 230 330 Q 290 230, 350 330 Z" fill="url(#sandStone)" />
  <path d="M 450 330 Q 510 230, 570 330 Z" fill="url(#sandStone)" />

  <!-- Base Platform / Fortress Wall -->
  <rect x="180" y="320" width="440" height="60" fill="#794619" rx="3" />

  <!-- Kalash & Flag -->
  <circle cx="400" cy="72" r="7" fill="#FFE082" />
  <rect x="398" y="45" width="4" height="27" fill="#FFE082" />
  <path d="M 402 45 L 438 55 L 402 65 Z" fill="#FF5722" />

  <!-- Mandir Archway -->
  <path d="M 375 380 L 375 335 Q 400 315, 425 335 L 425 380 Z" fill="#2E1B0D" />

  <!-- Title Badge -->
  <rect x="250" y="440" width="300" height="36" rx="18" fill="rgba(0,0,0,0.6)" />
  <text x="400" y="464" font-family="'Segoe UI', Poppins, sans-serif" font-size="16" font-weight="bold" fill="#FFE082" text-anchor="middle">
    SOMNATH FIRST JYOTIRLINGA
  </text>
</svg>
