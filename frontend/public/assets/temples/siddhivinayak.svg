<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mumbaiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="goldDome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#mumbaiSky)" />

  <!-- Multi-dome Golden Siddhivinayak Architecture -->
  <!-- Modern Multi-angular Sanctum Base -->
  <polygon points="260,370 230,290 570,290 540,370" fill="#4E342E" />
  <rect x="250" y="370" width="300" height="40" fill="#3E2723" />

  <!-- Main Central Gold Kalash Shikhara Dome -->
  <path d="M 400 90 Q 425 180, 445 250 L 355 250 Q 375 180, 400 90 Z" fill="url(#goldDome)" />
  <circle cx="400" cy="80" r="10" fill="#FFFDE7" />
  <rect x="398" y="50" width="4" height="30" fill="#FFFDE7" />
  <path d="M 402 50 L 435 60 L 402 70 Z" fill="#D50000" />

  <!-- Surrounding Smaller Golden Shikhara Domes (Octagonal geometry) -->
  <path d="M 330 160 Q 345 210, 360 260 L 300 260 Q 315 210, 330 160 Z" fill="url(#goldDome)" />
  <path d="M 470 160 Q 485 210, 500 260 L 440 260 Q 455 210, 470 160 Z" fill="url(#goldDome)" />
  
  <path d="M 280 210 Q 295 250, 310 290 L 250 290 Q 265 250, 280 210 Z" fill="url(#goldDome)" opacity="0.9" />
  <path d="M 520 210 Q 535 250, 550 290 L 490 290 Q 505 250, 520 210 Z" fill="url(#goldDome)" opacity="0.9" />

  <!-- Middle Terrace Level with Carvings -->
  <rect x="250" y="250" width="300" height="40" fill="url(#goldDome)" rx="2" />
  <circle cx="400" cy="270" r="12" fill="#E65100" /> <!-- Ganesha Symbol Motif -->

  <!-- Golden Temple Entrance Arch -->
  <path d="M 370 410 L 370 340 Q 400 320, 430 340 L 430 410 Z" fill="#FFB300" />
  <path d="M 380 410 L 380 350 Q 400 335, 420 350 L 420 410 Z" fill="#1A1A1A" />

  <!-- Title Badge -->
  <rect x="230" y="440" width="340" height="36" rx="18" fill="rgba(0,0,0,0.6)" />
  <text x="400" y="464" font-family="'Segoe UI', Poppins, sans-serif" font-size="16" font-weight="bold" fill="#FFE082" text-anchor="middle">
    SHREE SIDDHIVINAYAK TEMPLE
  </text>
</svg>
